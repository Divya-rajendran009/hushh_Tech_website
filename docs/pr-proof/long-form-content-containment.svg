<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Visual proof for long-form public content containment</title>
  <desc id="desc">The Terms of Service page now uses a narrower readable content column and wrapping rules so long public text stays contained across responsive viewports.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Long-form public content containment</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Terms sections now stay inside a readable column with safer wrapping on narrow screens.</text>

  <g transform="translate(70 165)">
    <rect width="500" height="420" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="30" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Before</text>
    <rect x="30" y="84" width="440" height="260" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
    <line x1="60" y1="125" x2="430" y2="125" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
    <line x1="60" y1="158" x2="455" y2="158" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
    <line x1="60" y1="191" x2="485" y2="191" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
    <line x1="60" y1="224" x2="430" y2="224" stroke="#9ca3af" stroke-width="10" stroke-linecap="round"/>
    <line x1="60" y1="257" x2="470" y2="257" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
    <text x="30" y="386" font-family="Arial, sans-serif" font-size="15" fill="#7f1d1d">Wide measure and long strings can push past the content edge.</text>
  </g>

  <g transform="translate(630 165)">
    <rect width="500" height="420" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="30" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#065f46">After</text>
    <rect x="95" y="84" width="310" height="260" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <line x1="125" y1="125" x2="365" y2="125" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
    <line x1="125" y1="158" x2="375" y2="158" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
    <line x1="125" y1="191" x2="355" y2="191" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
    <line x1="125" y1="224" x2="382" y2="224" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
    <line x1="125" y1="257" x2="330" y2="257" stroke="#16a34a" stroke-width="10" stroke-linecap="round"/>
    <path d="M95 360 H405" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="386" font-family="Arial, sans-serif" font-size="15" fill="#065f46">Readable 3xl column plus wrapping keeps sections contained.</text>
  </g>

  <rect x="70" y="625" width="1060" height="54" rx="10" fill="#111827"/>
  <text x="95" y="659" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Changed: Terms of Service long-form sections use a narrower max width, responsive padding, and overflow-wrap containment.</text>
</svg>
