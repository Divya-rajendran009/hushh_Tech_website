<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Visual proof for responsive media and text alignment</title>
  <desc id="desc">The business services media-and-text section now stacks on mobile with centered content and keeps a balanced side-by-side layout on desktop.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Media-and-text responsive alignment</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Business services ecosystem section aligns cleanly across mobile and desktop breakpoints.</text>

  <g transform="translate(80 165)">
    <rect width="300" height="430" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="30" y="48" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Mobile</text>
    <rect x="48" y="85" width="204" height="150" rx="14" fill="#e0f2fe" stroke="#7dd3fc"/>
    <circle cx="116" cy="151" r="34" fill="#38bdf8"/>
    <rect x="150" y="128" width="62" height="12" rx="6" fill="#0284c7"/>
    <rect x="150" y="154" width="78" height="10" rx="5" fill="#7dd3fc"/>
    <rect x="55" y="278" width="190" height="14" rx="7" fill="#111827"/>
    <rect x="42" y="312" width="216" height="10" rx="5" fill="#9ca3af"/>
    <rect x="62" y="338" width="176" height="10" rx="5" fill="#9ca3af"/>
    <rect x="78" y="364" width="144" height="10" rx="5" fill="#9ca3af"/>
    <text x="52" y="405" font-family="Arial, sans-serif" font-size="14" fill="#065f46">Stacked, centered, max-width image</text>
  </g>

  <g transform="translate(460 165)">
    <rect width="660" height="430" rx="22" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <text x="32" y="48" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Desktop</text>
    <rect x="48" y="105" width="245" height="228" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
    <circle cx="140" cy="210" r="48" fill="#38bdf8"/>
    <rect x="185" y="178" width="74" height="14" rx="7" fill="#0284c7"/>
    <rect x="185" y="212" width="82" height="12" rx="6" fill="#7dd3fc"/>
    <g transform="translate(360 125)">
      <rect width="170" height="18" rx="9" fill="#111827"/>
      <rect y="55" width="220" height="11" rx="5.5" fill="#9ca3af"/>
      <rect y="84" width="198" height="11" rx="5.5" fill="#9ca3af"/>
      <rect y="113" width="230" height="11" rx="5.5" fill="#9ca3af"/>
      <rect y="162" width="210" height="11" rx="5.5" fill="#9ca3af"/>
      <rect y="191" width="180" height="11" rx="5.5" fill="#9ca3af"/>
    </g>
    <path d="M324 105 V333" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/>
    <text x="48" y="383" font-family="Arial, sans-serif" font-size="14" fill="#065f46">Side-by-side layout keeps media from shrinking and text left-aligned.</text>
  </g>

  <rect x="70" y="635" width="1060" height="54" rx="10" fill="#111827"/>
  <text x="95" y="669" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Changed: business services media section uses responsive column/row direction, bounded image width, and breakpoint-aware text alignment.</text>
</svg>
