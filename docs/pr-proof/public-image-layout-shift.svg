<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Visual proof for reduced layout shift in public image gallery cards</title>
  <desc id="desc">The public market update gallery now reserves the same 16 to 9 frame for image skeletons and loaded images, preventing card height changes during loading.</desc>
  <rect width="1200" height="720" fill="#f7fafc"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Public image gallery layout stability</text>
  <text x="70" y="110" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Skeleton placeholders and loaded charts now share one reserved 16:9 frame.</text>

  <g transform="translate(70 160)">
    <rect width="500" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="28" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Before</text>
    <text x="28" y="78" font-family="Arial, sans-serif" font-size="15" fill="#6b7280">Loaded image height could differ from the skeleton.</text>
    <rect x="30" y="115" width="190" height="145" rx="10" fill="#e5e7eb"/>
    <rect x="245" y="115" width="190" height="210" rx="10" fill="#e5e7eb"/>
    <rect x="30" y="290" width="190" height="80" rx="10" fill="#fee2e2" stroke="#fecaca"/>
    <path d="M225 220 C235 245 238 270 235 295" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <path d="M232 295 L216 276 M232 295 L250 279" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="395" font-family="Arial, sans-serif" font-size="15" fill="#7f1d1d">Card height can jump after image decode.</text>
  </g>

  <g transform="translate(630 160)">
    <rect width="500" height="420" rx="12" fill="#ffffff" stroke="#d1fae5"/>
    <text x="28" y="46" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#065f46">After</text>
    <text x="28" y="78" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Both states reserve the same aspect-ratio box.</text>
    <rect x="30" y="115" width="190" height="107" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="245" y="115" width="190" height="107" rx="10" fill="#d1fae5" stroke="#34d399"/>
    <path d="M55 190 L100 155 L132 178 L158 148 L195 190 Z" fill="#60a5fa"/>
    <path d="M270 190 L315 155 L347 178 L373 148 L410 190 Z" fill="#10b981"/>
    <line x1="30" y1="260" x2="435" y2="260" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="310" font-family="Arial, sans-serif" font-size="15" fill="#065f46">Stable reserved frame keeps surrounding content in place.</text>
  </g>

  <rect x="70" y="625" width="1060" height="54" rx="10" fill="#111827"/>
  <text x="95" y="659" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Changed: MarketUpdateGallery skeleton and loaded images use the same 16:9 slot.</text>
</svg>
