<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Visual proof for public page action keyboard focus order</title>
  <desc id="desc">The public hero bottom action area now uses native button controls so keyboard focus follows the visible Home, Portfolio, Fund A, and Profile order.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Public action area focus order</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Keyboard focus now reaches each visible public hero tab action in left-to-right order.</text>

  <g transform="translate(90 170)">
    <rect width="450" height="360" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="30" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#991b1b">Before</text>
    <rect x="52" y="150" width="346" height="78" rx="30" fill="#050505"/>
    <g font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      <text x="105" y="198" fill="#ffffff">Home</text>
      <text x="188" y="198" fill="#9ca3af">Portfolio</text>
      <text x="271" y="198" fill="#9ca3af">Trade</text>
      <text x="354" y="198" fill="#9ca3af">Profile</text>
    </g>
    <path d="M92 252 C145 285 296 285 356 252" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
    <text x="30" y="305" font-family="Arial, sans-serif" font-size="15" fill="#7f1d1d">Clickable wrappers were skipped by keyboard focus.</text>
  </g>

  <g transform="translate(660 170)">
    <rect width="450" height="360" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="30" y="48" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#065f46">After</text>
    <rect x="52" y="150" width="346" height="78" rx="30" fill="#050505"/>
    <g font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      <text x="105" y="198" fill="#ffffff">Home</text>
      <text x="188" y="198" fill="#d1d5db">Portfolio</text>
      <text x="271" y="198" fill="#d1d5db">Fund A</text>
      <text x="354" y="198" fill="#d1d5db">Profile</text>
    </g>
    <g fill="#dcfce7" stroke="#22c55e" stroke-width="3">
      <rect x="77" y="168" width="56" height="42" rx="12"/>
      <rect x="160" y="168" width="56" height="42" rx="12"/>
      <rect x="243" y="168" width="56" height="42" rx="12"/>
      <rect x="326" y="168" width="56" height="42" rx="12"/>
    </g>
    <path d="M133 226 L160 226 M216 226 L243 226 M299 226 L326 226" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <text x="30" y="305" font-family="Arial, sans-serif" font-size="15" fill="#065f46">Native buttons create a predictable tab sequence.</text>
  </g>

  <rect x="70" y="625" width="1060" height="54" rx="10" fill="#111827"/>
  <text x="95" y="659" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Changed: public hero bottom actions are native buttons with labels and visible focus rings.</text>
</svg>
