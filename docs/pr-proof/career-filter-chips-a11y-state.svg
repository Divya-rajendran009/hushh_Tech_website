<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Career filter chips accessible state semantics proof</title>
  <desc id="desc">Shows selected and unselected career department filter chips with aria-pressed state semantics.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#000000">
    Career Filter Chips: Accessible State Semantics
  </text>
  <text x="450" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Selected and unselected department chips expose aria-pressed state.
  </text>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="80" y="155" width="80" height="40" rx="20" fill="#f5fafe" stroke="#cbd5e1"/>
    <text x="120" y="181" text-anchor="middle" fill="#6b7280">All</text>
    <text x="120" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#0066cc">aria-pressed="false"</text>

    <rect x="190" y="155" width="190" height="40" rx="20" fill="#00a9e0"/>
    <text x="285" y="181" text-anchor="middle" fill="#ffffff">Research &amp; Analytics</text>
    <text x="285" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#0066cc">aria-pressed="true"</text>

    <rect x="410" y="155" width="125" height="40" rx="20" fill="#f5fafe" stroke="#cbd5e1"/>
    <text x="472.5" y="181" text-anchor="middle" fill="#6b7280">Engineering</text>
    <text x="472.5" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#0066cc">aria-pressed="false"</text>

    <rect x="565" y="155" width="115" height="40" rx="20" fill="#f5fafe" stroke="#cbd5e1"/>
    <text x="622.5" y="181" text-anchor="middle" fill="#6b7280">Operations</text>
    <text x="622.5" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="#0066cc">aria-pressed="false"</text>
  </g>

  <rect x="90" y="295" width="720" height="145" rx="12" fill="#fafafa" stroke="#cbd5e1"/>
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#000000">
    Visible jobs update from the selected chip
  </text>
  <text x="450" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">
    Screen readers receive pressed/not pressed state for each filter chip.
  </text>
  <text x="450" y="418" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#0066cc">
    role="group" aria-label="Filter career departments"
  </text>
</svg>
