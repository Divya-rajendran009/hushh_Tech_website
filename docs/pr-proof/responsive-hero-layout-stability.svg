<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Visual proof for responsive homepage hero layout stability</title>
  <desc id="desc">The homepage hero now uses dynamic viewport height, clamped desktop height, explicit grid tracks, and reserved card height to keep the layout stable across mobile, tablet, and desktop breakpoints.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Responsive hero layout stability</text>
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Stable viewport sizing and reserved hero card dimensions across breakpoints.</text>

  <g transform="translate(70 165)">
    <rect width="270" height="430" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="24" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Mobile</text>
    <rect x="24" y="75" width="222" height="95" rx="10" fill="#111827"/>
    <rect x="24" y="190" width="222" height="170" rx="14" fill="#1f2937"/>
    <line x1="44" y1="220" x2="184" y2="220" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="252" x2="210" y2="252" stroke="#9ca3af" stroke-width="8" stroke-linecap="round"/>
    <line x1="44" y1="284" x2="140" y2="284" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
    <text x="24" y="396" font-family="Arial, sans-serif" font-size="14" fill="#065f46">Uses 100dvh to avoid browser chrome jumps.</text>
  </g>

  <g transform="translate(405 165)">
    <rect width="340" height="430" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="24" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Tablet</text>
    <rect x="24" y="75" width="292" height="85" rx="10" fill="#111827"/>
    <rect x="24" y="185" width="292" height="190" rx="14" fill="#1f2937"/>
    <line x1="52" y1="235" x2="262" y2="235" stroke="#60a5fa" stroke-width="9" stroke-linecap="round"/>
    <line x1="52" y1="270" x2="285" y2="270" stroke="#9ca3af" stroke-width="9" stroke-linecap="round"/>
    <line x1="52" y1="305" x2="205" y2="305" stroke="#34d399" stroke-width="9" stroke-linecap="round"/>
    <text x="24" y="396" font-family="Arial, sans-serif" font-size="14" fill="#065f46">Stack spacing remains consistent before desktop.</text>
  </g>

  <g transform="translate(810 165)">
    <rect width="320" height="430" rx="18" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="24" y="44" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Desktop</text>
    <rect x="24" y="85" width="130" height="240" rx="12" fill="#111827"/>
    <rect x="174" y="85" width="122" height="240" rx="14" fill="#1f2937"/>
    <line x1="42" y1="135" x2="122" y2="135" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
    <line x1="42" y1="165" x2="136" y2="165" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>
    <line x1="194" y1="145" x2="260" y2="145" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
    <line x1="194" y1="184" x2="278" y2="184" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
    <line x1="194" y1="223" x2="246" y2="223" stroke="#9ca3af" stroke-width="7" stroke-linecap="round"/>
    <text x="24" y="396" font-family="Arial, sans-serif" font-size="14" fill="#065f46">Clamped two-column track keeps hero card stable.</text>
  </g>

  <rect x="70" y="635" width="1060" height="54" rx="10" fill="#111827"/>
  <text x="95" y="669" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Changed: homepage hero uses stable dvh/clamp sizing, explicit desktop grid tracks, and reserved Fund A card height.</text>
</svg>
